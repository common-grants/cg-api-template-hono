# Marks this project as a standalone pnpm root so it never resolves into a
# parent workspace when it is cloned inside one.
packages: []

# Dependency install scripts are blocked unless they are answered here.
#   esbuild        - backs tsx and Vitest; its script links the prebuilt binary.
#   @scarf/scarf   - a telemetry ping pulled in by the CommonGrants CLI.
#                    Denied on purpose. It is answered rather than left blank
#                    so `pnpm install` does not stop on an unresolved prompt.
allowBuilds:
  esbuild: true
  "@scarf/scarf": false

# ---------------------------------------------------------------------------
# Reviewed, temporary audit exception - GHSA-2q42-4q24-7rgv (high)
# ---------------------------------------------------------------------------
# This is the ONLY excepted advisory. It is NOT a blanket ignore: every other
# high or critical finding, and any audit-service failure, still fails
# `pnpm run audit`. Verified by the controlled checks recorded in
# docs/known-spec-discrepancies.md.
#
# Affected locked versions: @typespec/compiler 1.15.0 and @typespec/openapi3,
# reached only through `@common-grants/cli` -> the `pnpm check:spec` checker.
# The advisory has no patched release at the time of writing.
#
# Reachability: the advisory concerns a malicious TypeSpec `version` value
# escaping the OpenAPI emitter's output directory. This project never compiles
# TypeSpec. `cg check spec` parses and compares two existing OpenAPI documents;
# the CLI only reaches TypeSpec by spawning a separate process from its `init`
# and `compile` commands, which this project never runs.
#
# Reassess monthly and on any CLI or TypeSpec change; remove once patched.
# Full rationale: docs/known-spec-discrepancies.md
auditConfig:
  ignoreGhsas:
    - GHSA-2q42-4q24-7rgv
