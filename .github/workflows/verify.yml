name: Verify

# Reusable verification: static checks, build, and one coverage-enabled test
# run that includes OpenAPI export verification. Callers decide when this runs.
on:
  workflow_call:
    inputs:
      sdk-version:
        description: >-
          Exact @common-grants/sdk version to test against. Leave empty to use
          the committed lockfile. When set, the manifest and lockfile are
          changed in the runner workspace only and never pushed.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: Static checks, build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: inputs.sdk-version == ''
        run: pnpm install --frozen-lockfile

      # The probe deliberately leaves the lockfile behind. Nothing in this
      # workflow ever commits or pushes it. The version reaches the shell
      # through the environment, and is rejected unless it is a bare semver,
      # so a dispatch input cannot smuggle in shell syntax.
      - name: Install dependencies with a candidate SDK version
        if: inputs.sdk-version != ''
        env:
          SDK_VERSION: ${{ inputs.sdk-version }}
        run: |
          if ! printf '%s' "$SDK_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::sdk-version must be an exact semver version, got '$SDK_VERSION'"
            exit 1
          fi
          pnpm add --save-exact "@common-grants/sdk@$SDK_VERSION"
          pnpm install --no-frozen-lockfile

      - name: Report the resolved SDK version
        run: |
          resolved=$(node -p "require('./node_modules/@common-grants/sdk/package.json').version")
          echo "Testing against @common-grants/sdk@${resolved}"
          echo "@common-grants/sdk@${resolved} on $(node --version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run static checks
        run: pnpm run checks

      - name: Build
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      # Proves the documented export command works end to end, not just the
      # in-process export the test suite drives.
      - name: Export the OpenAPI document
        run: pnpm run export:openapi

      - name: Upload the OpenAPI document
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: openapi-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/openapi.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30
