name: CI

# Thin caller. Every pull request and every push to main runs the same three
# reusable workflows. No path filters: a required check that silently does not
# run is worse than one that runs and passes quickly.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref, but never on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify (required)
    uses: ./.github/workflows/verify.yml

  audit:
    name: Audit (required)
    uses: ./.github/workflows/audit.yml

  # Advisory. `advisory: true` makes a checker failure non-blocking inside the
  # reusable workflow, which still reports the checker's real outcome and full
  # report. GitHub does not allow `continue-on-error` on a job that calls a
  # reusable workflow, so the decision is passed as an input instead. Promote
  # the check by setting `advisory: false` once a clean run justifies it — see
  # docs/known-spec-discrepancies.md.
  check-spec:
    name: Check spec (advisory)
    uses: ./.github/workflows/check-spec.yml
    with:
      advisory: true
