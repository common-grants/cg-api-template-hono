name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref, but never on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Checks, build, tests and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Package manager and script runner only; Node stays the runtime. The
      # latest stable Bun is used deliberately rather than an exact pin, so a
      # drift against the engines.bun floor surfaces here first.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks, build and tests
        run: bun run ci

      - name: Audit dependencies
        run: bun run audit
