name: SDK probe

# Weekly early warning. Runs the same verification, audit and checker against
# the latest published @common-grants/sdk, even when that is outside the range
# the lockfile pins.
#
# It never commits or pushes the manifest or lockfile it changes, and it is not
# part of the pull-request merge gate: a red probe tells the owners that a
# future SDK release will need work, it does not block unrelated changes.
on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      sdk-version:
        description: Exact SDK version to probe. Leave empty for the latest published release.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Resolved once so every downstream job tests the same candidate, rather
  # than each re-resolving "latest" and possibly disagreeing.
  resolve:
    name: Resolve the candidate SDK version
    runs-on: ubuntu-latest
    outputs:
      sdk-version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve
        id: resolve
        env:
          REQUESTED: ${{ inputs.sdk-version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
          else
            version=$(npm view @common-grants/sdk version)
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::resolved a version that is not exact semver: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Probing @common-grants/sdk@$version" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify against the candidate SDK
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      sdk-version: ${{ needs.resolve.outputs.sdk-version }}

  audit:
    name: Audit the candidate SDK
    needs: resolve
    uses: ./.github/workflows/audit.yml
    with:
      sdk-version: ${{ needs.resolve.outputs.sdk-version }}

  check-spec:
    name: Check spec against the candidate SDK (advisory)
    needs: resolve
    uses: ./.github/workflows/check-spec.yml
    with:
      sdk-version: ${{ needs.resolve.outputs.sdk-version }}
      advisory: true
