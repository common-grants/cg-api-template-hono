name: Check spec

# Reusable protocol conformance check. It exports the OpenAPI document the API
# actually serves and runs the CommonGrants CLI checker over it.
#
# The checker's real exit status and full report are always preserved. Whether
# a checker failure fails this workflow is the caller's choice, made through
# the `advisory` input.
#
# The advisory handling lives here, on the checker step, because GitHub does
# not allow `continue-on-error` on a job that calls a reusable workflow through
# `uses`. It applies to the checker step alone: install and export failures
# still fail the workflow, and it can never affect the required verify and
# audit workflows.
on:
  workflow_call:
    inputs:
      sdk-version:
        description: Exact @common-grants/sdk version to generate the document from.
        type: string
        required: false
        default: ""
      advisory:
        description: >-
          When true, a checker failure is reported and annotated but does not
          fail this workflow. Set to false to make the check blocking.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  check-spec:
    name: Export and check the OpenAPI document
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: inputs.sdk-version == ''
        run: pnpm install --frozen-lockfile

      - name: Install dependencies with a candidate SDK version
        if: inputs.sdk-version != ''
        env:
          SDK_VERSION: ${{ inputs.sdk-version }}
        run: |
          if ! printf '%s' "$SDK_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::sdk-version must be an exact semver version, got '$SDK_VERSION'"
            exit 1
          fi
          pnpm add --save-exact "@common-grants/sdk@$SDK_VERSION"
          pnpm install --no-frozen-lockfile

      - name: Export the OpenAPI document
        run: pnpm run export:openapi

      # `pipefail` keeps the checker's exit status rather than `tee`'s, so the
      # captured report never turns a failure into a pass. `continue-on-error`
      # is scoped to this one step: it changes whether the failure stops the
      # job, never what the step reports. `steps.checker.outcome` below is the
      # real result either way.
      #
      # The checker is the CLI locked in this project's own lockfile, so it is
      # inside the audited dependency graph.
      - name: Run the CommonGrants checker
        id: checker
        continue-on-error: ${{ inputs.advisory }}
        run: |
          set -o pipefail
          pnpm exec cg check spec dist/openapi.json 2>&1 | tee check-spec-report.txt

      - name: Summarize the checker outcome
        if: always()
        env:
          OUTCOME: ${{ steps.checker.outcome }}
          ADVISORY: ${{ inputs.advisory }}
        run: |
          if [ "$OUTCOME" = "failure" ] && [ "$ADVISORY" = "true" ]; then
            echo "::warning title=Spec check (advisory)::The CommonGrants checker failed. This is advisory and does not block; see the job summary and the check-spec artifact."
          fi
          {
            if [ "$ADVISORY" = "true" ]; then
              echo "### CommonGrants checker: ${OUTCOME} (advisory — does not block)"
            else
              echo "### CommonGrants checker: ${OUTCOME} (required)"
            fi
            echo
            echo 'Structural comparison against the base protocol. A failure here is a'
            echo 'reported discrepancy, not a certification of conformance either way.'
            echo '```'
            cat check-spec-report.txt 2>/dev/null || echo '(the checker produced no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the checker report and document
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: check-spec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            check-spec-report.txt
            dist/openapi.json
          if-no-files-found: warn
          retention-days: 30
